[project]
name = "trabajo-final-pp5"
version = "0.1.0"
description = "Centro Regional de Coordinación de Emergencias - Paradigmas de Programación V"
readme = "README.md"
authors = [
    { name = "JazminLopezQB", email = "jrlopez@fie.under.edu.ar" }
]
requires-python = ">=3.13"
dependencies = []

[project.scripts]
trabajo-final-pp5 = "trabajo_final_pp5:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
